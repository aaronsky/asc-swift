name: Bazel

on:
  push:
    branches:
      - main
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/bazel.yml"
      - "**/BUILD.bazel"
      - "**/BUILD.overlay"
      - "bazel/*"
      - "Examples/**/*.swift"
      - "MODULE.bazel"
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
  pull_request:
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/bazel.yml"
      - "**/BUILD.bazel"
      - "**/BUILD.overlay"
      - "bazel/*"
      - "Examples/**/*.swift"
      - "MODULE.bazel"
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
  workflow_dispatch: ~

concurrency:
  group: bazel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macOS:
    runs-on: macos-latest
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
      - uses: actions/checkout@v7
      - run: |
          bazel test \
            --config=cache \
            --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY} \
            //...
  Linux:
    runs-on: ubuntu-24.04
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          bazelisk-version: 1.x
      - uses: actions/checkout@v7
      - run: |
          bazel test \
            --config=cache \
            --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY} \
            //...
  bzlmod-e2e-macOS:
    runs-on: macos-latest
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
      - uses: actions/checkout@v7
      - run: |
          bazel build \
            --config=cache \
            --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY} \
            //...
        working-directory: Examples/bzlmod
  bzlmod-e2e-linux:
    runs-on: ubuntu-24.04
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          bazelisk-version: 1.x
      - uses: actions/checkout@v7
      - run: |
          bazel build \
            --config=cache \
            --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY} \
            //...
        working-directory: Examples/bzlmod
